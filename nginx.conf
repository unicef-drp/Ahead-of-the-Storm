# Ahead of the Storm — nginx reverse proxy with tile cache
#
# Test config:   nginx -t -c /path/to/nginx.conf
# Start:         nginx -c /path/to/nginx.conf
# Reload:        nginx -s reload
# Stop:          nginx -s quit
#
# IMPORTANT: start the tile server bound to loopback only:
#   uvicorn tile_server:app --host 127.0.0.1 --port 8001
# (not --host 0.0.0.0) so external clients cannot bypass the cache.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Tile cache — survives nginx reload; does NOT survive a full cache flush
    # (rm -rf /var/cache/nginx/aots_tiles) which is safe to do at any time.
    # -------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/aots_tiles
                     levels=1:2
                     keys_zone=aots_tiles:20m
                     max_size=2g
                     inactive=1h
                     use_temp_path=off;

    # -------------------------------------------------------------------------
    # Upstreams
    # -------------------------------------------------------------------------
    upstream dash_app {
        server 127.0.0.1:8050;
        keepalive 16;
    }

    upstream tile_server {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Global defaults
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65s;
    client_max_body_size 50m;

    # Gzip — compress JSON tooltip responses; WebP tiles are pre-compressed
    # and will not be re-compressed (Content-Encoding already set).
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript;

    # Shared proxy defaults — overridden per location where needed
    proxy_http_version      1.1;
    proxy_set_header        Connection "";          # enable HTTP/1.1 keepalive to upstreams
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_connect_timeout   10s;
    proxy_read_timeout      60s;
    proxy_send_timeout      60s;

    # -------------------------------------------------------------------------
    # Server
    # -------------------------------------------------------------------------
    server {
        listen      80;
        server_name _;   # catch-all

        # ------------------------------------------------------------------
        # /tiles/ — cached tile renders
        # Cache key = path + query string so that different zoom/coord/params
        # always hit different cache entries.
        # ------------------------------------------------------------------
        location /tiles/ {
            proxy_pass http://tile_server;

            proxy_cache             aots_tiles;
            proxy_cache_key         "$uri$is_args$args";
            proxy_cache_valid       200 5m;
            proxy_cache_valid       204 1m;   # ocean/empty tiles — avoid upstream hammering
            proxy_cache_valid       any 0;    # do not cache errors
            proxy_cache_use_stale   error timeout updating;
            proxy_cache_lock        on;       # one upstream request per cache miss (thundering-herd guard)
            proxy_cache_lock_timeout 5s;

            # Expose cache state for debugging (HIT / MISS / BYPASS / EXPIRED …)
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ------------------------------------------------------------------
        # /tile-value/ — hover tooltips — NO cache (must always be fresh)
        # ------------------------------------------------------------------
        location /tile-value/ {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # /health — tile server health check — NO cache
        # ------------------------------------------------------------------
        location /health {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # /preload/ — cache warming — NO cache, long timeout
        # ------------------------------------------------------------------
        location /preload/ {
            proxy_pass          http://tile_server;
            proxy_cache         off;
            proxy_read_timeout  300s;
        }

        # ------------------------------------------------------------------
        # /stats/ and /admin-stats/ — min/max aggregates — NO cache (always fresh)
        # ------------------------------------------------------------------
        location /stats/ {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        location /admin-stats/ {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # / — Dash application
        # Long read timeout because first-load Dash callbacks can be slow.
        # Buffering is disabled so SSE / streaming responses reach the client
        # incrementally rather than being held until the upstream closes.
        # ------------------------------------------------------------------
        location / {
            proxy_pass          http://dash_app;
            proxy_read_timeout  120s;
            proxy_buffering     off;

            # Websocket / SSE upgrade support (Dash uses long-poll by default
            # but this future-proofs for ws: callbacks)
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $http_upgrade;
        }
    }
}
