# Ahead of the Storm — nginx config template for SPCS container
#
# Used by entrypoint.sh via sed substitution — do not use without substitution:
#   __NGINX_PORT__  → public port (default 8000, set via PORT env var)
#   __DASH_PORT__   → gunicorn Dash port (default 8050)
#   __TILE_PORT__   → uvicorn tile server port (default 8001)
#
# Both upstreams bind loopback only — external clients MUST go through nginx.

worker_processes 1;   # single worker; SPCS scales via compute pool instances

error_log /var/log/nginx/error.log warn;
pid       /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Tile cache — shared across all users on this container instance.
    # Survives Dash restarts; safe to rm -rf at any time.
    # -------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/aots_tiles
                     levels=1:2
                     keys_zone=aots_tiles:20m
                     max_size=2g
                     inactive=1h
                     use_temp_path=off;

    # -------------------------------------------------------------------------
    # Upstreams (loopback only — not reachable externally)
    # -------------------------------------------------------------------------
    upstream dash_app {
        server 127.0.0.1:__DASH_PORT__;
        keepalive 16;
    }

    upstream tile_server {
        server 127.0.0.1:__TILE_PORT__;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Global defaults
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65s;
    client_max_body_size 10m;

    access_log /var/log/nginx/access.log combined;

    # Gzip — compress JSON tooltip responses; WebP tiles are pre-compressed.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript;

    # Shared proxy defaults
    proxy_http_version      1.1;
    proxy_set_header        Connection "";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_connect_timeout   10s;
    proxy_read_timeout      60s;
    proxy_send_timeout      60s;

    # -------------------------------------------------------------------------
    # Server
    # -------------------------------------------------------------------------
    server {
        listen      __NGINX_PORT__;
        server_name _;

        # ------------------------------------------------------------------
        # /tiles/ — cached tile renders (WebP raster + MVT vector)
        # ------------------------------------------------------------------
        location /tiles/ {
            proxy_pass http://tile_server;

            proxy_cache             aots_tiles;
            proxy_cache_key         "$uri$is_args$args";
            proxy_cache_valid       200 5m;
            proxy_cache_valid       204 1m;
            proxy_cache_valid       any 0;
            proxy_cache_use_stale   error timeout updating;
            proxy_cache_lock        on;
            proxy_cache_lock_timeout 5s;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ------------------------------------------------------------------
        # /tile-value/ — hover tooltips — NO cache (always fresh)
        # ------------------------------------------------------------------
        location /tile-value/ {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # /health + /preload — tile server endpoints — NO cache
        # ------------------------------------------------------------------
        location /health {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        location /preload/ {
            proxy_pass          http://tile_server;
            proxy_cache         off;
            proxy_read_timeout  300s;   # preload warms many tiles; needs time
        }

        # ------------------------------------------------------------------
        # /stats/ and /admin-stats/ — min/max aggregates — NO cache (always fresh)
        # ------------------------------------------------------------------
        location /stats/ {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        location /admin-stats/ {
            proxy_pass http://tile_server;
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # / — Dash application
        # ------------------------------------------------------------------
        location / {
            proxy_pass          http://dash_app;
            proxy_read_timeout  120s;
            proxy_buffering     off;

            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $http_upgrade;
        }
    }
}
